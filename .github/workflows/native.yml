name: Schedule Native Build

on:
  push:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  repository: xuxiaowei-com-cn/incubator-seata
  ref: xuxiaowei/Seata-Namingserver-GraalVM

jobs:
  checkout:
    name: Checkout Code
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ env.repository }}

  call-remote:
    needs: checkout
    uses: ${{ env.repository }}/.github/workflows/native.yml@${{ env.ref }}
