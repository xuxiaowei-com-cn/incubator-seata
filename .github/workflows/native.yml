name: Native Build

on:
  push:
    branches: [ 2.x, develop, master ]
  pull_request:
    branches: [ 2.x, develop, master ]
    types: [ opened, reopened, synchronize ]
    paths-ignore:
      - '**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, ubuntu-24.04-arm, macos-26-intel, macos-26-large, windows-latest ]
        java: [ 25 ]
        module: [ server ]
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7.0.0
      - name: "Set up Java JDK"
        uses: actions/setup-java@v5.5.0
        with:
          distribution: 'graalvm'
          java-version: ${{ matrix.java }}
      - name: "Print maven version"
        run: ./mvnw -version
      - name: "Restore local maven repository cache"
        uses: actions/cache/restore@v4
        id: cache-maven-repository
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: "Install dependencies for ${{ matrix.module }}-${{ matrix.os }}"
        run: ./mvnw -T 4C clean -B -pl ${{ matrix.module }} install -DskipTests -am
      - name: "Compile native image for ${{ matrix.module }}-${{ matrix.os }}"
        run: ./mvnw -T 4C clean -B -pl ${{ matrix.module }} package -DskipTests -Pnative native:compile
      - name: "Delete snapshots from the Maven local repository"
        run: find ~/.m2/repository -type d -name '*-SNAPSHOT' -print -exec rm -r {} +
      - name: "Save local maven repository cache"
        uses: actions/cache/save@v4
        if: steps.cache-maven-repository.outputs.cache-hit != 'true'
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
