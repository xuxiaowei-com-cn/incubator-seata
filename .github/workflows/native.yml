name: Native Build

on:
  push:
    branches: [ test*, "*.*.*" ]
  pull_request:
    branches: [ 2.x, develop, master ]
    paths:
      - '.github/workflows/native.yml'
      - 'namingserver/src/main/resources/META-INF/native-image/org.apache.seata/seata-namingserver/**'
  workflow_call:
    inputs:
      repository:
        description: 'Repository to check out'
        type: string
        required: false
        default: ''
      ref:
        description: 'Branch or tag to check out'
        type: string
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, ubuntu-24.04-arm, macos-26, windows-latest ]
        module: [ namingserver ]
    env:
      USERNAME: seata
      PASSWORD: seata
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
      - name: "Set up Java JDK"
        uses: actions/setup-java@v5.5.0
        with:
          distribution: 'graalvm'
          java-version: 25
      - name: "Print maven version"
        run: ./mvnw -version
      - name: "Restore local maven repository cache"
        uses: actions/cache/restore@v6.1.0
        id: cache-maven-repository
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-${{ runner.arch }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-maven-
      - name: "Install dependencies for ${{ matrix.module }} in ${{ matrix.os }}"
        run: ./mvnw -T 4C clean -B -pl ${{ matrix.module }},server install -DskipTests -am
      - name: "Compile native image for ${{ matrix.module }} in ${{ matrix.os }}"
        run: ./mvnw -T 2C clean -B -pl ${{ matrix.module }} package -DskipTests -Pnative spring-boot:process-aot native:compile
      - name: "Upload binaries for ${{ matrix.module }} in ${{ matrix.os }}"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.module }}-native-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ matrix.module }}/target/seata-*-*
            !${{ matrix.module }}/target/*.jar
          if-no-files-found: error
      - name: "Verify native binary for ${{ matrix.module }} in ${{ matrix.os }}"
        shell: sh
        env:
          CONSOLE_USER_USERNAME: ${{ env.USERNAME }}
          CONSOLE_USER_PASSWORD: ${{ env.PASSWORD }}
        run: |
          rm -rf ./${{ matrix.module }}/target/*.jar
          ./${{ matrix.module }}/target/seata-${{ matrix.module }}-* &
      - name: "Check port 8081 for ${{ matrix.module }} in ${{ matrix.os }}"
        shell: sh
        if: matrix.module == 'namingserver'
        env:
          MAX_RETRIES: 6
          SLEEP_SECONDS: 5
        run: |
          i=1
          while [ $i -le $MAX_RETRIES ]; do
            if curl -sSf http://localhost:8081/naming/v1/health >/dev/null 2>&1; then
              echo "Port 8081 is responding"
              exit 0
            fi
            echo "Waiting for port 8081... ($i/$MAX_RETRIES)"
            sleep $SLEEP_SECONDS
            i=$((i + 1))
          done
          echo "ERROR: Port 8081 is not responding after $((MAX_RETRIES * SLEEP_SECONDS)) seconds"
          exit 1
      - name: "Start Seata server for ${{ matrix.module }} in ${{ matrix.os }}"
        if: matrix.module == 'namingserver'
        env:
          SEATA_REGISTRY_TYPE: seata
          SEATA_REGISTRY_SEATA_SERVER_ADDR: 127.0.0.1:8081
          SEATA_REGISTRY_SEATA_USERNAME: ${{ env.USERNAME }}
          SEATA_REGISTRY_SEATA_PASSWORD: ${{ env.PASSWORD }}
          MAX_RETRIES: 12
          SLEEP_SECONDS: 5
        shell: sh
        run: |
          ./mvnw -T 2C clean -B -pl server spring-boot:run -Prelease-seata-jar &
          sleep 5
          jcmd -l
          SEATA_SERVER_PID=$(jcmd -l | grep -i seata-server | awk '{print $1}')
          echo "Seata server started with PID=$SEATA_SERVER_PID"
          i=1
          while [ $i -le $MAX_RETRIES ]; do
            if curl -sSf http://localhost:8091/health >/dev/null 2>&1; then
              echo "Port 8091 is responding"
              exit 0
            fi
            echo "Waiting for port 8091... ($i/$MAX_RETRIES)"
            sleep $SLEEP_SECONDS
            i=$((i + 1))
          done
          echo "ERROR: Port 8091 is not responding after $((MAX_RETRIES * SLEEP_SECONDS)) seconds"
          exit 1
      - name: "Run native tests for ${{ matrix.module }} in ${{ matrix.os }}"
        run: ./mvnw -T 2C clean -B test -Ptest-native-${{ matrix.module }} -pl test-suite/test-native-${{ matrix.module }}
      - name: "Delete snapshots from the Maven local repository"
        shell: sh
        run: find ~/.m2/repository -type d -name '*-SNAPSHOT' -print -exec rm -r {} + || true
      - name: "Save local maven repository cache"
        uses: actions/cache/save@v6.1.0
        if: steps.cache-maven-repository.outputs.cache-hit != 'true'
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-${{ runner.arch }}-maven-${{ hashFiles('**/pom.xml') }}
