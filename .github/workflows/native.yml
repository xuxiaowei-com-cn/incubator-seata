name: Native Build

on:
  push:
    branches: [ 2.x, develop, master ]
  pull_request:
    branches: [ 2.x, develop, master ]
    types: [ opened, reopened, synchronize ]
    paths-ignore:
      - '**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, ubuntu-24.04-arm, macos-26-intel, macos-26, windows-latest ]
        module: [ server ]
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7.0.0
      - name: "Start MySQL via Docker (Linux only)"
        if: runner.os == 'Linux'
        shell: sh
        run: |
          docker run -d --name mysql-test \
            -e MYSQL_ALLOW_EMPTY_PASSWORD=yes \
            -e MYSQL_DATABASE=seata_test_native \
            -p 3306:3306 \
            mysql:8.0
          echo "Waiting for MySQL to be ready..."
          for i in $(seq 1 30); do
            if docker exec mysql-test mysqladmin ping -h localhost --silent 2>/dev/null; then
              echo "MySQL is ready"
              docker logs mysql-test --tail 10
              exit 0
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done
          echo "ERROR: MySQL failed to start after 60s"
          docker logs mysql-test --tail 50
          exit 1
      - name: "Set up Java JDK"
        uses: actions/setup-java@v5.5.0
        with:
          distribution: 'graalvm'
          java-version: 25
      - name: "Print maven version"
        run: ./mvnw -version
      - name: "Restore local maven repository cache"
        uses: actions/cache/restore@v6.1.0
        id: cache-maven-repository
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: "Install dependencies for ${{ matrix.module }} in ${{ matrix.os }}"
        run: ./mvnw -T 4C clean -B -pl ${{ matrix.module }},spring/seata-spring-boot-starter install -DskipTests -am
      - name: "Compile native image for ${{ matrix.module }} in ${{ matrix.os }}"
        run: ./mvnw -T 2C clean -B -pl ${{ matrix.module }} package -DskipTests -Pnative spring-boot:process-aot native:compile
      - name: "Upload binaries for ${{ matrix.module }} in ${{ matrix.os }}"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.module }}-native-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ matrix.module }}/target/seata-*-*
            !${{ matrix.module }}/target/*.jar
          if-no-files-found: error
      - name: "Verify native binary for ${{ matrix.module }} in ${{ matrix.os }}"
        shell: sh
        env:
          SEATA_CONFIG_TYPE: file
          SEATA_REGISTRY_TYPE: file
          SEATA_STORE_TYPE: file
        run: |
          rm -rf ./${{ matrix.module }}/target/*.jar
          ./${{ matrix.module }}/target/seata-${{ matrix.module }}-* &
          NATIVE_PID=$!
          echo "$NATIVE_PID" > ./seata-native-${{ matrix.module }}.pid
          echo "Native binary started with PID=$NATIVE_PID"
          sleep 10
          if kill -0 $NATIVE_PID 2>/dev/null; then
            echo "Native binary is running normally (PID=$NATIVE_PID)"
          else
            echo "ERROR: Native binary failed to start or crashed (PID=$NATIVE_PID)"
            exit 1
          fi
      - name: "Check port 8091 for ${{ matrix.module }} in ${{ matrix.os }}"
        shell: sh
        run: |
          NATIVE_PID=$(cat ./seata-native-${{ matrix.module }}.pid)
          echo "NATIVE_PID=$NATIVE_PID"
          for i in 1 2 3 4 5 6; do
            if curl -sSf http://localhost:8091/health >/dev/null 2>&1; then
              echo "Port 8091 is responding"
              exit 0
            fi
            echo "Waiting for port 8091... ($i/6)"
            sleep 5
          done
          echo "ERROR: Port 8091 is not responding after 30 seconds"
          exit 1
      - name: "Start test-native app for ${{ matrix.module }} in ${{ matrix.os }}"
        if: runner.os == 'Linux'
        run: |
          nohup ./mvnw -e -T 2C -Ptest-native -pl test-suite/test-native spring-boot:run &
          for i in 1 2 3 4 5 6; do
            if curl -sSf http://localhost:50180/actuator/health >/dev/null 2>&1; then
              echo "Port 50180 is responding"
              exit 0
            fi
            echo "Waiting for port 50180... ($i/6)"
            sleep 5
          done
          echo "ERROR: Port 50180 is not responding after 30 seconds"
          exit 1
      - name: "Run native tests for ${{ matrix.module }} in ${{ matrix.os }}"
        if: runner.os == 'Linux'
        run: ./mvnw -e -T 2C -Ptest-native -pl test-suite/test-native clean test
      - name: "Capture test reports on failure"
        if: failure() && runner.os == 'Linux'
        shell: sh
        run: |
          echo "=== Surefire Test Reports ==="
          if [ -d test-suite/test-native/target/surefire-reports ]; then
            for f in test-suite/test-native/target/surefire-reports/*.txt; do
              [ -f "$f" ] || continue
              echo ""
              echo "============================================================"
              echo "--- $f ---"
              echo "============================================================"
              cat "$f"
            done
          else
            echo "No surefire-reports directory found"
          fi
      - name: "Delete snapshots from the Maven local repository"
        shell: sh
        run: find ~/.m2/repository -type d -name '*-SNAPSHOT' -print -exec rm -r {} +
      - name: "Save local maven repository cache"
        uses: actions/cache/save@v6.1.0
        if: steps.cache-maven-repository.outputs.cache-hit != 'true'
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
