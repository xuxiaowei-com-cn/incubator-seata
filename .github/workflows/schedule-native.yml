name: Schedule Native Build

on:
  push:
    paths:
      - '.github/workflows/schedule-native.yml'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  call-remote:
    uses: xuxiaowei-com-cn/incubator-seata/.github/workflows/native.yml@xuxiaowei/Seata-Namingserver-GraalVM
    with:
      repository: xuxiaowei-com-cn/incubator-seata
      ref: xuxiaowei/Seata-Namingserver-GraalVM
