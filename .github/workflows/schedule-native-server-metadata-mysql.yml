name: Schedule Native Metadata (Server, MySQL)

on:
  push:
    paths:
      - '.github/workflows/schedule-native-server-metadata-mysql.yml'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      repository:
        description: 'Repository to check out'
        type: string
        required: false
        default: ''
      ref:
        description: 'Branch or tag to check out'
        type: string
        required: false
        default: ''

env:
  repository: xuxiaowei-com-cn/incubator-seata
  ref: xuxiaowei/Seata-Server-GraalVM

jobs:
  generate:
    name: generate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-latest: excluded because kill/shutdown signals are not available on Windows,
        # preventing graceful termination (actuator shutdown + kill -0 + kill -9) of the JVM process
        os: [ ubuntu-24.04, ubuntu-24.04-arm, macos-26 ]
    env:
      MODULE_NAME: server
      MODULE_PORT: 8091
      MODULE_READINESS: /health
      USERNAME: seata
      PASSWORD: seata
      STARTUP_TIMEOUT: 120
      SHUTDOWN_TIMEOUT: 120
      SEATA_SERVER_STARTUP_RETRIES: 120
      METADATA_FILE_WAIT_TIMEOUT: 120
      TEST_NATIVE_SERVER_STARTUP_RETRIES: 120
      # MySQL database used by the Seata server when store.mode=db
      STORE_DB_NAME: seata
      # MySQL database used by the test-native-server module
      TEST_DB_NAME: seata_test_native
      # MySQL driver version; must ship com.mysql.cj.jdbc.Driver
      MYSQL_DRIVER_VERSION: 8.0.33
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ inputs.repository || env.repository }}
          ref: ${{ inputs.ref || env.ref }}
      - name: "Start MySQL via Docker (Linux only)"
        if: runner.os == 'Linux'
        shell: sh
        run: |
          docker run -d --name mysql-test \
            -e MYSQL_ALLOW_EMPTY_PASSWORD=yes \
            -e MYSQL_DATABASE=${{ env.STORE_DB_NAME }} \
            -p 3306:3306 \
            mysql:8.0
          echo "Waiting for MySQL to be ready..."
          for i in $(seq 1 30); do
            if docker exec mysql-test mysqladmin ping -h localhost --silent 2>/dev/null; then
              echo "MySQL is ready"
              docker logs mysql-test --tail 10
              exit 0
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done
          echo "ERROR: MySQL failed to start after 60s"
          docker logs mysql-test --tail 50
          exit 1
      - name: "Initialize the ${{ env.STORE_DB_NAME }} schema in MySQL (Linux only)"
        if: runner.os == 'Linux'
        shell: sh
        run: |
          SCHEMA_FILE="script/server/db/mysql.sql"
          if [ ! -f "${SCHEMA_FILE}" ]; then
            echo "ERROR: ${SCHEMA_FILE} not found in the checked out repository."
            exit 1
          fi

          # The database is created by the container entrypoint (MYSQL_DATABASE), which can
          # still be running slightly after the server answers mysqladmin ping.
          echo "Waiting for the ${STORE_DB_NAME} database..."
          DB_READY=0
          i=1
          while [ $i -le 60 ]; do
            if docker exec mysql-test mysql -uroot -e "USE ${STORE_DB_NAME};" >/dev/null 2>&1; then
              DB_READY=1
              echo "${STORE_DB_NAME} database is available after ${i}s."
              break
            fi
            sleep 1
            i=$((i + 1))
          done
          if [ ${DB_READY} -ne 1 ]; then
            echo "ERROR: ${STORE_DB_NAME} database was not created within 60s."
            docker logs mysql-test --tail 50
            exit 1
          fi

          echo "Creating database ${TEST_DB_NAME} for the test-native-server module..."
          docker exec mysql-test mysql -uroot \
            -e "CREATE DATABASE IF NOT EXISTS ${TEST_DB_NAME};"

          echo "Importing ${SCHEMA_FILE} into database ${STORE_DB_NAME}..."
          docker exec -i mysql-test mysql -uroot "${STORE_DB_NAME}" < "${SCHEMA_FILE}"

          echo "Tables in database ${STORE_DB_NAME}:"
          docker exec mysql-test mysql -uroot -e "SHOW TABLES;" "${STORE_DB_NAME}"
      - name: "Print current git SHA"
        id: git-sha
        run: |
          GIT_SHA=$(git rev-parse HEAD)
          echo "GIT_SHA=${GIT_SHA}" >> "${GITHUB_ENV}"
          echo "git-sha=${GIT_SHA}" >> "${GITHUB_OUTPUT}"
          echo "Current git SHA: ${GIT_SHA}"
          mkdir -p ./target
          echo "${GIT_SHA}" > ./git-sha.txt
      - name: "Checkout schedule-native tools"
        uses: actions/checkout@v7.0.0
        with:
          path: schedule-native-tools
      - name: "Set up Java JDK"
        uses: actions/setup-java@v5.5.0
        with:
          distribution: 'graalvm'
          java-version: 25
      - name: "Set up Python"
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - name: "Print maven version"
        run: ./mvnw -version
      - name: "Restore local maven repository cache"
        uses: actions/cache/restore@v6.1.0
        id: cache-maven-repository
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-${{ runner.arch }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-maven-
      - name: "Install dependencies for ${{ env.MODULE_NAME }} in ${{ matrix.os }}"
        run: ./mvnw -T 4C clean -B -pl ${{ env.MODULE_NAME }},server,spring/seata-spring-boot-starter install -DskipTests -am
      - name: "Package ${{ env.MODULE_NAME }}"
        run: ./mvnw -T 2C -B -pl ${{ env.MODULE_NAME }} package -DskipTests -Prelease-seata-jar
      - name: "List ${{ env.MODULE_NAME }} jar"
        shell: sh
        run: ls -lh ${{ env.MODULE_NAME }}/target/seata-${{ env.MODULE_NAME }}.jar
      - name: "Provide the MySQL JDBC driver for store.mode=db (Linux only)"
        if: runner.os == 'Linux'
        shell: sh
        run: |
          # Seata resolves the MySQL driver from a 'jdbc' directory next to the classpath
          # entry, i.e. '${{ env.MODULE_NAME }}/target/jdbc' for a jar started with 'java -jar'.
          # See org.apache.seata.core.store.db.AbstractDataSourceProvider#createMysqlDriverClassLoaders
          #
          # Use an absolute path: with '-pl ${{ env.MODULE_NAME }}' Maven resolves relative
          # output directories against the module basedir, not the workspace root.
          DRIVER_DIR="$(pwd)/${{ env.MODULE_NAME }}/target/jdbc"
          mkdir -p "${DRIVER_DIR}"
          COPY_OK=1
          ./mvnw -B -pl ${{ env.MODULE_NAME }} dependency:copy \
            -Dartifact=com.mysql:mysql-connector-j:${{ env.MYSQL_DRIVER_VERSION }} \
            -DoutputDirectory="${DRIVER_DIR}" || COPY_OK=0
          if [ ${COPY_OK} -ne 1 ] || ! ls "${DRIVER_DIR}"/mysql-connector-j*.jar >/dev/null 2>&1; then
            echo "Maven did not provide the driver, downloading it from Maven Central..."
            curl -fsSL -o "${DRIVER_DIR}/mysql-connector-j-${{ env.MYSQL_DRIVER_VERSION }}.jar" \
              "https://repo1.maven.org/maven2/com/mysql/mysql-connector-j/${{ env.MYSQL_DRIVER_VERSION }}/mysql-connector-j-${{ env.MYSQL_DRIVER_VERSION }}.jar"
          fi
          if ! ls "${DRIVER_DIR}"/mysql-connector-j*.jar >/dev/null 2>&1; then
            echo "ERROR: the MySQL driver is missing in ${DRIVER_DIR}."
            exit 1
          fi
          echo "MySQL driver available for Seata:"
          ls -lh "${DRIVER_DIR}"
      - name: "Start ${{ env.MODULE_NAME }} in background with native-image-agent"
        shell: sh
        env:
          CONSOLE_USER_USERNAME: ${{ env.USERNAME }}
          CONSOLE_USER_PASSWORD: ${{ env.PASSWORD }}
          MANAGEMENT_ENDPOINT_SHUTDOWN_ACCESS: unrestricted
          MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "*"

          SEATA_CONFIG_TYPE: file
          SEATA_REGISTRY_TYPE: file
          # store.mode=db exercises the JDBC / MySQL driver reachability metadata
          SEATA_STORE_MODE: db
          SEATA_STORE_DB_DATASOURCE: druid
          SEATA_STORE_DB_DBTYPE: mysql
          SEATA_STORE_DB_DRIVERCLASSNAME: com.mysql.cj.jdbc.Driver
          SEATA_STORE_DB_URL: "jdbc:mysql://127.0.0.1:3306/${{ env.STORE_DB_NAME }}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true"
          SEATA_STORE_DB_USER: root
          SEATA_STORE_DB_PASSWORD: ""
        run: |
          if [ "${{ runner.os }}" != 'Linux' ]; then
            # MySQL (Docker) and the MySQL JDBC driver are only available on Linux runners,
            # so fall back to the file store to still collect baseline metadata.
            export SEATA_STORE_MODE=file
          fi

          SEATA_SECURITY_IGNORE_URLS=$(sed -n 's/.*urls:[ \t]*//p' ${{ env.MODULE_NAME }}/src/main/resources/application.yml)
          echo "SEATA_SECURITY_IGNORE_URLS=$SEATA_SECURITY_IGNORE_URLS"
          SEATA_SECURITY_IGNORE_URLS="/actuator/shutdown,${SEATA_SECURITY_IGNORE_URLS}"
          echo "SEATA_SECURITY_IGNORE_URLS=$SEATA_SECURITY_IGNORE_URLS"
          export SEATA_SECURITY_IGNORE_URLS="$SEATA_SECURITY_IGNORE_URLS"
          echo "Starting ${{ env.MODULE_NAME }} in background on port ${{ env.MODULE_PORT }} with store.mode=${SEATA_STORE_MODE}..."
          java -agentlib:native-image-agent=config-output-dir=./target/native-image-config \
            -jar ./${{ env.MODULE_NAME }}/target/seata-${{ env.MODULE_NAME }}.jar &

          # Wait for JVM to start, then resolve the real OS PID via jcmd.
          # jcmd always reports the real OS PID on every platform (Linux, macOS, Windows),
          # unlike $! which is unreliable on Windows (MSYS2/Git Bash maps PIDs internally).
          sleep 3
          jcmd -l
          JAR_PATTERN="seata-${{ env.MODULE_NAME }}.jar"
          APP_PID=$(jcmd -l | grep "${JAR_PATTERN}" | grep -v jcmd | awk '{print $1}')
          if [ -z "${APP_PID}" ]; then
            echo "ERROR: Could not find PID for ${JAR_PATTERN} via jcmd."
            jcmd -l
            exit 1
          fi
          echo "${APP_PID}" > ./target/app.pid
          echo "Application started with PID: ${APP_PID}"
      - name: "Wait for ${{ env.MODULE_NAME }} to be ready"
        shell: sh
        run: |
          dump_seata_logs() {
            echo "----- Seata server logs -----"
            find "${HOME}/logs/seata" -type f -name '*.log' -print -exec tail -n 200 {} + 2>/dev/null || true
            echo "----- End of Seata server logs -----"
          }

          echo "Waiting for application to be ready on port ${{ env.MODULE_PORT }}..."
          ELAPSED=0
          while [ ${ELAPSED} -lt ${{ env.STARTUP_TIMEOUT }} ]; do
            if curl -sSf http://localhost:${{ env.MODULE_PORT }}${{ env.MODULE_READINESS }} >/dev/null 2>&1; then
              echo "Application is ready after ${ELAPSED}s!"
              exit 0
            fi
            # store.mode=db fails fast when the datasource or the driver is wrong, so do not
            # wait for the full timeout if the JVM is already gone.
            if [ -f ./target/app.pid ] && ! kill -0 "$(cat ./target/app.pid)" 2>/dev/null; then
              echo "ERROR: Application exited before becoming ready."
              dump_seata_logs
              exit 1
            fi
            sleep 2
            ELAPSED=$((ELAPSED + 2))
            echo "  Still waiting... ${ELAPSED}s elapsed."
          done

          echo "ERROR: Application did not become ready within ${{ env.STARTUP_TIMEOUT }}s."
          dump_seata_logs
          exit 1
      - name: Start test-native-server for server module
        if: runner.os != 'macOS'
        run: |
          ./mvnw -T 2C -B -Ptest-native-server -pl test-suite/test-native-server spring-boot:run &
          TEST_NATIVE_SERVER_PID=$!
          
          sleep 30
          jcmd -l
          JAR_PATTERN="SeataTestNativeApplication"
          APP_PID=$(jcmd -l | grep "${JAR_PATTERN}" | grep -v jcmd | awk '{print $1}')
          if [ -z "${APP_PID}" ]; then
            echo "ERROR: Could not find PID for ${JAR_PATTERN} via jcmd."
            jcmd -l
            exit 1
          fi
          echo "${APP_PID}" > ./target/test-native-server.pid
          echo "Application started with PID: ${APP_PID}"
          
          echo "$TEST_NATIVE_SERVER_PID" > ./test-native-server.pid
          echo "Seata server started with PID=$TEST_NATIVE_SERVER_PID"
          i=1
          while [ $i -le ${{ env.TEST_NATIVE_SERVER_STARTUP_RETRIES }} ]; do
            if curl -sSf http://localhost:50180/health >/dev/null 2>&1; then
              echo "Port 50180 is responding"
              exit 0
            fi
            echo "Waiting for port 50180... ($i/${{ env.TEST_NATIVE_SERVER_STARTUP_RETRIES }})"
            sleep 1
            i=$((i + 1))
          done
          echo "ERROR: Port 50180 is not responding after ${{ env.TEST_NATIVE_SERVER_STARTUP_RETRIES }} seconds"
          exit 1
      - name: "Run ${{ env.MODULE_NAME }} native tests for native-image metadata"
        if: runner.os != 'macOS'
        shell: sh
        run: |
          echo "Exercising endpoints to collect native-image metadata..."
          ./mvnw -T 2C -B test -Ptest-native-${{ env.MODULE_NAME }} -pl test-suite/test-native-${{ env.MODULE_NAME }}
      - name: "Stop ${{ env.MODULE_NAME }}"
        shell: sh
        run: |
          PID_FILE="./target/app.pid"

          if [ ! -f "${PID_FILE}" ]; then
            echo "PID file not found, nothing to stop."
            exit 0
          fi

          jcmd -l

          APP_PID=$(cat "${PID_FILE}")
          echo "Stopping application (PID: ${APP_PID})..."

          # Step 1: Graceful shutdown via Spring Boot Actuator shutdown endpoint.
          # This triggers a proper Spring context close with shutdown hooks,
          # ensuring native-image-agent writes reachability-metadata.json.

          # Step 2: Always send SIGTERM as a safety net to trigger JVM shutdown
          # hooks, so the native-image-agent can write reachability-metadata.json.
          # If the actuator shutdown already triggered a graceful exit, this is a
          # harmless no-op; if the endpoint was unresponsive, this ensures metadata
          # is still collected.
          kill -TERM ${APP_PID} 2>/dev/null || true

          echo "Port is no longer reachable (or timeout reached)."

          # Step 4: Wait for the JVM process to exit within SHUTDOWN_TIMEOUT.
          # If it is still alive, force-kill and fail the step.
          SHUTDOWN_ELAPSED=0
          while kill -0 ${APP_PID} 2>/dev/null && [ ${SHUTDOWN_ELAPSED} -lt ${{ env.SHUTDOWN_TIMEOUT }} ]; do
            sleep 1
            SHUTDOWN_ELAPSED=$((SHUTDOWN_ELAPSED + 1))
            echo "  Still waiting for shutdown... ${SHUTDOWN_ELAPSED}s elapsed."
          done

          if kill -0 ${APP_PID} 2>/dev/null; then
            echo "ERROR: Application did not shut down gracefully within ${SHUTDOWN_TIMEOUT}s."
            exit 1
          fi

          wait ${APP_PID} 2>/dev/null || true
          echo "Application stopped."
      - name: "Wait for reachability-metadata.json for ${{ env.MODULE_NAME }}"
        shell: sh
        run: |
          jcmd -l
          METADATA_FILE="./target/native-image-config/reachability-metadata.json"
          ELAPSED=0
          while [ ! -f "${METADATA_FILE}" ] && [ ${ELAPSED} -lt ${{ env.METADATA_FILE_WAIT_TIMEOUT }} ]; do
            sleep 1
            ELAPSED=$((ELAPSED + 1))
            echo "  Waiting for reachability-metadata.json... ${ELAPSED}s elapsed."
          done

          if [ -f "${METADATA_FILE}" ]; then
            echo "reachability-metadata.json found (${ELAPSED}s)."
            ls -lh "${METADATA_FILE}"
          else
            echo "ERROR: reachability-metadata.json not found after ${ELAPSED}s."
            echo "The native-image-agent did not collect metadata on this platform."
            exit 1
          fi
      - name: "Upload ${{ env.MODULE_NAME }} reachability-metadata.json"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.MODULE_NAME }}-mysql-${{ matrix.os }}-${{ env.GIT_SHA }}-reachability-metadata
          path: |
            ./target/native-image-config/reachability-metadata.json
            ./git-sha.txt
      - name: "Merge native-image config for server"
        shell: sh
        env:
          EXECUTE_NATIVE_METADATA_MERGE_SERVER: true
        run: |
          ./mvnw test -Dtest=ExecuteMergeNativeImageMetadataTests#server -pl test-suite/test-native-metadata-merge -Ptest-native-metadata-merge
      - name: "Apply spotless formatting for ${{ env.MODULE_NAME }}"
        run: ./mvnw spotless:apply -pl ${{ env.MODULE_NAME }}
      - name: "Show ${{ env.MODULE_NAME }} native-image config diff"
        id: diff
        shell: sh
        run: |
          git diff | tee ./target/native-image-config.diff
          if [ -s ./target/native-image-config.diff ]; then
            echo "has_diff=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_diff=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: "Send ${{ env.MODULE_NAME }} native-image config diff to WeChat Work"
        if: steps.diff.outputs.has_diff == 'true' && env.WECHAT_WEBHOOK_URL != ''
        env:
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
        shell: sh
        run: |
          python3 schedule-native-tools/script/send_wechat_work.py \
            ${{ secrets.WECHAT_WEBHOOK_URL }} \
            ./target/native-image-config.diff \
            "${{ env.MODULE_NAME }}" \
            "${{ matrix.os }}"
      - name: "Upload ${{ env.MODULE_NAME }} native-image config diff"
        if: steps.diff.outputs.has_diff == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.MODULE_NAME }}-mysql-${{ matrix.os }}-${{ env.GIT_SHA }}-native-image-config-diff
          path: |
            ./target/native-image-config.diff
            ./git-sha.txt
      - name: "Delete snapshots from the Maven local repository"
        shell: sh
        run: find ~/.m2/repository -type d -name '*-SNAPSHOT' -print -exec rm -r {} +
      - name: "Save local maven repository cache"
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-${{ runner.arch }}-maven-${{ hashFiles('**/pom.xml') }}
