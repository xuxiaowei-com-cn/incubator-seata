name: Schedule Native Build

on:
  push:
    paths:
      - '.github/workflows/schedule-native-namingserver.yml'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  call-remote:
    name: call-remote
    uses: apache/incubator-seata/.github/workflows/native-namingserver.yml@2.x
    with:
      repository: apache/incubator-seata
      ref: 2.x

  download-artifacts:
    name: download-artifacts
    needs: call-remote
    runs-on: ubuntu-24.04
    steps:
      - name: "Download namingserver-native-Linux-ARM64"
        uses: actions/download-artifact@v4
        with:
          name: namingserver-native-Linux-ARM64
          path: .
      - name: "Download namingserver-native-Linux-X64"
        uses: actions/download-artifact@v4
        with:
          name: namingserver-native-Linux-X64
          path: .
      - name: "Download namingserver-native-Windows-X64"
        uses: actions/download-artifact@v4
        with:
          name: namingserver-native-Windows-X64
          path: .
      - name: "Download namingserver-native-macOS-ARM64"
        uses: actions/download-artifact@v4
        with:
          name: namingserver-native-macOS-ARM64
          path: .
      - name: "List downloaded artifacts"
        run: find .
