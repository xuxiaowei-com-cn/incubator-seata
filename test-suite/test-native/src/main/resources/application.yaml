spring:
  application:
    name: test-native

---

spring:
  datasource:
    driver-class-name: ${DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
    url: ${DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/${DATASOURCE_DB:seata_test_native}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DATASOURCE_USERNAME:root}
    password: ${DATASOURCE_PASSWORD:}

---

spring:
  sql:
    init:
      mode: ${SQL_INIT_MODE:NEVER}
      schema-locations:
        - classpath*:schema.sql
      data-locations:
        - classpath*:data.sql

---

seata:
  config:
    type: file
  registry:
    type: file
  tx-service-group: default_tx_group
  service:
    vgroup-mapping:
      default_tx_group: default
    grouplist:
      default: ${SEATA_SERVER_ADDR:127.0.0.1:8091}
